<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555555;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Contact Form</h2>
        <form action="#" method="POST">
            <div>
                <label for="name">Name and Surname</label>
                <input type="text" id="name" name="name" placeholder="Input your name and surname" required>
            </div>

            <div>
                <label for="email">E-mail Address</address></label>
                <input type="email" id="email" name="email" placeholder="person@example.com" required>
            </div>

            <div>
                <label for="subject">Which html tag used for main page caption?</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Choose one of them</option>
                    <option value="Head">Head</option>
                    <option value="H1">H1</option>
                    
                </select>
                <label for="subject">Which html tag used for making path to other pages?</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Choose one of them</option>
                    <option value="Link">link</option>
                    <option value="a">a</option>
                    
                </select>
                <label for="subject">Which css property used for changing background color?</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Choose one of them</option>
                    <option value="color">color</option>
                    <option value="bgcolor">bgcolor</option>
                    
                </select>
            
            
            </div>

            <div>
                <label for="message">Your Message</label>
                <textarea id="message" name="message" placeholder="Write your suggests here..." required></textarea>
            </div>

            <button type="submit">Send</button>
        </form>
    </div>

</body>
</html>
